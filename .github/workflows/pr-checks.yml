name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check changed TypeScript formatting
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run format:check:changed -- "$FORMAT_BASE_SHA"

      - name: Lint TypeScript and React
        run: npm run lint

      - name: Check React hook dependency debt
        run: npm run lint:exhaustive-deps

      - name: Check source hotspot sizes
        run: npm run size:hotspots

      - name: Type check
        run: npm run check

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Build web app
        run: npm run build

  rust-quality:
    name: Rust quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Check formatting
        run: npm run format:rust:check

      - name: Run Clippy
        run: npm run clippy:check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
