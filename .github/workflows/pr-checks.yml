name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml
    with:
      runner: ubuntu-latest
      node-version: "24"
      format-base: ${{ github.event.pull_request.base.sha || '' }}

  rust-quality:
    name: Rust
    uses: ./.github/workflows/rust-ci.yml
    with:
      node-version: "24"
