name: Rust CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "26"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust / ${{ matrix.check }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        check: [format, clippy, compile, doctests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Check Rust
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            format) npm run format:rust:check ;;
            clippy)
              clippy_dir="$(mktemp -d "$RUNNER_TEMP/codevo-clippy.XXXXXX")"
              trap 'rm -rf "$clippy_dir"' EXIT
              CODEVO_PERF_CAPTURE_RUN_TOKEN="$(uuidgen)" \
              CODEVO_PERF_CAPTURE_RESULT_PATH="$clippy_dir/result.json" \
              CODEVO_PERF_CAPTURE_WORK_ROOT="$clippy_dir" \
              CODEVO_PERF_CAPTURE_SHUTDOWN_PATH="$clippy_dir/shutdown.json" \
              CODEVO_PERF_CAPTURE_SMOKE=0 npm run clippy:check
              ;;
            compile) cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets ;;
            doctests) cargo test --manifest-path src-tauri/Cargo.toml --locked --doc ;;
            *) exit 1 ;;
          esac

  test-build:
    name: Rust test archive
    runs-on: macos-15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      workspace: ${{ steps.archive.outputs.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned test runner
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - name: Build and archive Rust tests once
        id: archive
        run: |
          archive_dir="$RUNNER_TEMP/rust-test-archive"
          mkdir -p "$archive_dir"
          cargo nextest archive --manifest-path src-tauri/Cargo.toml --locked --archive-file "$archive_dir/tests.tar.zst"
          archive_sha="$(shasum -a 256 "$archive_dir/tests.tar.zst" | cut -d ' ' -f 1)"
          printf 'sha256=%s\nworkspace=%s\n' "$archive_sha" "$GITHUB_WORKSPACE/src-tauri" >> "$GITHUB_OUTPUT"
      - name: Upload immutable test archive
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rust-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-test-archive/tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  tests:
    name: Rust tests / ${{ matrix.shard }} of 4
    needs: test-build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Install pinned test runner
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - name: Download this run's test archive
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.test-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/rust-test-archive
          merge-multiple: true
      - name: Verify archive and compile-time source path
        env:
          ARCHIVE_SHA256: ${{ needs.test-build.outputs.sha256 }}
          BUILD_WORKSPACE: ${{ needs.test-build.outputs.workspace }}
        run: |
          # Some fixtures use env!("CARGO_MANIFEST_DIR"); runtime remapping cannot change it.
          test "$BUILD_WORKSPACE" = "$GITHUB_WORKSPACE/src-tauri"
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          cd "$RUNNER_TEMP/rust-test-archive"
          printf '%s  tests.tar.zst\n' "$ARCHIVE_SHA256" | shasum -a 256 -c -
      - name: Run Rust test shard without rebuilding
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo-nextest nextest run
          --archive-file "$RUNNER_TEMP/rust-test-archive/tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE/src-tauri"
          --partition "slice:$SHARD/4" --no-fail-fast --test-threads 4
