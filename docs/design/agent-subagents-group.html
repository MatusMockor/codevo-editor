<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codevo · Subagenti v threade</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #08090b; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#demo { --bg:#0f1115; --panel:#14171c; --surface:#1a1d23; --hover:#22262d; --border:#20232a; --text:#d3d7de; --muted:#9aa0ab; --subtle:#6a7180; --strong:#f1f3f7; --accent:#4fcdb3; --accent-ink:#08201b; --warn:#e4c088; --danger:#ef8a8a; color: var(--text); max-width: 1180px; margin: 0 auto; }
#demo .window[data-theme="light"] { --bg:#f6f7f9; --panel:#eef0f3; --surface:#ffffff; --hover:#e6e9ee; --border:#e5e8ed; --text:#333840; --muted:#656d7b; --subtle:#99a1ad; --strong:#171a1f; --accent:#13836f; --accent-ink:#ffffff; --warn:#9a6a14; --danger:#b3261e; }
#demo .window[data-theme="oneDarkPro"] { --bg:#21252b; --panel:#282c34; --surface:#31363f; --hover:#3a404b; --border:#31363f; --text:#abb2bf; --muted:#9aa2b1; --subtle:#5c6370; --strong:#ffffff; --accent:#61afef; --accent-ink:#21252b; }
#demo .window[data-theme="dracula"] { --bg:#21222c; --panel:#282a36; --surface:#313343; --hover:#3b3e52; --border:#343746; --text:#f8f8f2; --muted:#b3bbe0; --subtle:#6272a4; --strong:#ffffff; --accent:#bd93f9; --accent-ink:#21222c; }
#demo .window[data-theme="catppuccinMocha"] { --bg:#181825; --panel:#1e1e2e; --surface:#2a2a3d; --hover:#35364a; --border:#2a2b3c; --text:#cdd6f4; --muted:#a6adc8; --subtle:#6c7086; --strong:#ffffff; --accent:#cba6f7; --accent-ink:#181825; }
#demo .window[data-theme="ayuMirage"] { --bg:#1f2430; --panel:#232834; --surface:#272d3c; --hover:#323a4c; --border:#2a3140; --text:#cbccc6; --muted:#9aa3b4; --subtle:#707a8c; --strong:#ffffff; --accent:#ffcc66; --accent-ink:#1f2430; }

#demo button, #demo select { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding: 0 2px 14px; color: var(--muted); }
.seg { display:inline-flex; gap:2px; padding:3px; border-radius:9px; background: var(--panel); }
.seg button { padding:5px 11px; border-radius:7px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--strong); }
.bar select { background: var(--panel); border-radius:8px; padding:6px 10px; }
.note { padding: 0 2px 14px; color: var(--muted); max-width: 92ch; }
.note b { color: var(--strong); font-weight: 600; }
.window { color: var(--text); display:grid; grid-template-columns: minmax(0,1fr) var(--panelw, 0px); min-height: 640px; border-radius: 14px; overflow:hidden; background: var(--bg); }
.thread { padding: 26px clamp(18px, 5vw, 56px) 20px; display:flex; flex-direction:column; gap: 14px; min-width:0; }
.user { align-self:flex-end; max-width: 80%; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: var(--panel); }
.prose { color: var(--text); max-width: 70ch; }
.tool { display:flex; gap:10px; align-items:center; color: var(--muted); font-size: 12.5px; }
.tool code { color: var(--subtle); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spacer { flex:1; }
.composer { padding: 14px 16px; border-radius: 14px; background: var(--panel); color: var(--subtle); }
.dot { width:7px; height:7px; border-radius:50%; flex:none; background: var(--subtle); }
.dot.working { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.dot.completed { background: var(--accent); opacity:.55; animation:none; }
.dot.failed { background: var(--danger); }
@keyframes pulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .dot.working { animation:none; } }
.mono { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.chip { padding: 0 6px; border-radius: 5px; background: var(--hover); color: var(--muted); font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; }
.now { --old: 1; }
/* current (today) */
.old { border-radius: 10px; }
.old .head { display:flex; align-items:center; gap:8px; color: var(--strong); font-weight:600; padding: 4px 0; }
.old .head span:last-child { margin-left:auto; color: var(--muted); font-weight:400; font-size:12px; }
.old .r { display:grid; grid-template-columns: 14px 120px minmax(0,1fr) auto; gap:8px; align-items:center; padding: 5px 0; color: var(--muted); }
.old .r b { color: var(--strong); font-weight:600; }
.old .r i { font-style:normal; color: var(--accent); }
/* group */
.group { border-radius: 12px; background: var(--panel); overflow:hidden; }
.ghead { display:flex; align-items:center; gap:10px; width:100%; padding: 10px 14px; text-align:left; }
.ghead strong { color: var(--strong); font-weight:600; }
.ghead .sum { color: var(--muted); }
.ghead .stack { display:flex; gap:4px; margin-left:auto; align-items:center; }
.ghead .chev { color: var(--subtle); transition: transform .15s; }
.group[data-open="false"] .chev { transform: rotate(-90deg); }
.group[data-open="false"] .rows { display:none; }
.rows { padding: 2px 6px 8px; }
.row { display:grid; grid-template-columns: 7px minmax(0,1fr) auto; grid-template-rows: 20px 18px 16px; column-gap: 10px; align-items:center; height: 66px; padding: 5px 8px; border-radius: 9px; }
.row:hover { background: var(--surface); }
.row .title { display:flex; gap:8px; align-items:baseline; min-width:0; }
.row .title span:first-child { color: var(--strong); font-weight: 500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .time { color: var(--muted); text-align:right; }
.row .act { grid-column: 2 / 4; color: var(--muted); font-size: 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .act.fail { color: var(--danger); }
.row .meta { grid-column: 2 / 4; color: var(--subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .stop { grid-row: 1; grid-column: 3; display:none; }
/* cards */
.cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; padding: 2px 8px 10px; }
.card { padding: 10px 12px; border-radius: 10px; background: var(--surface); min-width:0; }
.card .top { display:flex; align-items:center; gap:8px; }
.card .top span.t { color: var(--strong); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.card .act { color: var(--muted); font-size:12px; margin: 4px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .meta { display:flex; justify-content:space-between; color: var(--subtle); }
.card .bar2 { height:2px; border-radius:2px; margin-top:8px; background: var(--hover); overflow:hidden; }
.card .bar2 i { display:block; height:100%; width:40%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
.card.done .bar2 i { width:100%; animation:none; opacity:.5; }
@keyframes slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
/* dock + panel */
.dock { display:flex; align-items:center; gap:10px; padding: 8px 12px; border-radius: 11px; background: var(--panel); }
.dock strong { color: var(--strong); font-weight:600; }
.dock .latest { color: var(--muted); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.dock button { padding: 4px 10px; border-radius: 7px; color: var(--muted); background: var(--surface); }
.oneline { display:flex; align-items:center; gap:10px; color: var(--muted); }
.oneline strong { color: var(--strong); font-weight:600; }
.oneline button { color: var(--accent); }
.panel { background: var(--panel); padding: 16px 8px; min-width:0; overflow:hidden; }
.panel .chip { display:none; }
.panel h4 { margin: 0 8px 8px; display:flex; justify-content:space-between; font-size: 11px; font-weight: 500; letter-spacing:.04em; text-transform: uppercase; color: var(--subtle); }
</style>
</head>
<body>
<div id="demo">
  <div class="bar"><div class="seg" id="variants"></div><label>Téma <select id="theme"></select></label></div>
  <p class="note" id="note"></p>
  <div class="window" id="win"><section class="thread" id="thread"></section><aside class="panel" id="panel" hidden></aside></div>
</div>
<script>
const THEMES = { dark: "Codevo Dark", light: "Codevo Light", oneDarkPro: "One Dark Pro", dracula: "Dracula", catppuccinMocha: "Catppuccin Mocha", ayuMirage: "Ayu Mirage" };
const VARIANTS = {
  now: ["Dnes", "<b>Súčasný stav.</b> Každý riadok sa volá general-purpose, aktivita je surový príkaz, chýba čas, tokeny aj počet krokov. Po odrolovaní nie je vidno, že niečo beží."],
  A: ["A · Skupina ako T3", "<b>Jedna skupina na dávku spustení.</b> Hlavička so súhrnom a bodkami stavov. Riadky majú pevnú výšku a tri údaje ako v T3: názov úlohy s typom, čo agent práve robí, metriky. Názov je popis úlohy, nie typ agenta."],
  B: ["B · Karty", "<b>Rovnaké dáta ako A, ale v mriežke kariet.</b> Lepšie pri dvoch až šiestich agentoch, vidno ich naraz bez rolovania. Pri väčšom počte zaberá viac miesta."],
  C: ["C · Lišta nad composerom a panel", "<b>V chate ostane jeden riadok, živý stav je stále na očiach nad composerom.</b> Detail sa otvára v pravom paneli agentov ako v T3. Rieši aj to, že dnes počas práce hlavného agenta nevidno, že niečo beží."]
};
const AGENTS = [
  { title: "Stream 0 lookup contract", type: "general-purpose", model: "opus-5", status: "completed", sec: 654, tok: 137.0, tools: 35, acts: ["167 tests passed, contract frozen"] },
  { title: "Stream A Rust lookup backend", type: "general-purpose", model: "opus-5", status: "working", sec: 212, tok: 61.2, tools: 18, acts: ["Writing repository_lookup/hosts.rs", "Running cargo test --lib repository_lookup", "Reading git/bounded_process.rs"] },
  { title: "Stream B application and gateway", type: "general-purpose", model: "opus-5", status: "working", sec: 208, tok: 74.9, tools: 23, acts: ["Running vitest tauriRepositoryLookupGateway", "Writing useRepositoryLookup.ts", "Running npm run check"] },
  { title: "Stream C remote add-project UI", type: "general-purpose", model: "opus-5", status: "working", sec: 205, tok: 58.3, tools: 16, acts: ["Writing AgentRailCloneRow.tsx", "Reading AgentAddProjectDialog.tsx", "Running vitest remoteAddProject"] },
  { title: "Coalesce snapshot turn events", type: "general-purpose", model: "fable-5.1", status: "working", sec: 96, tok: 33.8, tools: 9, acts: ["Finding existing merge tests", "Reading agentBackgroundActivity.ts", "Writing agentTurnEventSupersession.ts"] }
];
const S = { variant: "A", open: true, panel: false, tick: 0 };
const $ = (id) => document.getElementById(id);
const fmt = (s) => s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
const act = (a) => a.acts[a.status === "working" ? S.tick % a.acts.length : 0];
const meta = (a) => `${a.model} · ${a.tok.toFixed(1)}k tok · ${a.tools} tools`;
const working = () => AGENTS.filter((a) => a.status === "working").length;
const summary = () => `${working()} working · ${AGENTS.length - working()} completed`;
function row(a) { return `<div class="row"><span class="dot ${a.status}"></span><span class="title"><span>${a.title}</span><span class="chip">${a.type}</span></span><span class="time mono">${fmt(a.sec)}${a.status === "completed" ? " ✓" : ""}</span><span class="act">${act(a)}</span><span class="meta mono">${meta(a)}</span></div>`; }
function card(a) { return `<div class="card ${a.status === "completed" ? "done" : ""}"><div class="top"><span class="dot ${a.status}"></span><span class="t">${a.title}</span><span class="mono" style="color:var(--muted)">${fmt(a.sec)}</span></div><div class="act">${act(a)}</div><div class="meta mono"><span>${a.model}</span><span>${a.tok.toFixed(1)}k · ${a.tools} tools</span></div><div class="bar2"><i></i></div></div>`; }
function head() { return `<button class="ghead" data-toggle><span class="dot ${working() ? "working" : "completed"}"></span><strong>${working() ? "Kicked off" : "Ran"} ${AGENTS.length} subagents</strong><span class="sum">${summary()}</span><span class="stack">${AGENTS.map((a) => `<span class="dot ${a.status}"></span>`).join("")}<span class="chev">⌄</span></span></button>`; }
function body() {
  if (S.variant === "now") return `<div class="old"><div class="head"><span class="dot working"></span>Started 5 subagents<span>${summary()} ⌄</span></div>${AGENTS.map((a) => `<div class="r"><span>›</span><b>${a.type}</b><code class="mono" style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${act(a)}</code>${a.status === "working" ? "<i>working</i>" : "<span>completed</span>"}</div>`).join("")}</div>`;
  if (S.variant === "A") return `<div class="group" data-open="${S.open}">${head()}<div class="rows">${AGENTS.map(row).join("")}</div></div>`;
  if (S.variant === "B") return `<div class="group" data-open="${S.open}">${head()}<div class="rows"><div class="cards">${AGENTS.map(card).join("")}</div></div></div>`;
  return `<div class="oneline"><span class="dot ${working() ? "working" : "completed"}"></span><strong>Kicked off ${AGENTS.length} subagents</strong><span>${summary()}</span><button data-panel>${S.panel ? "Skryť panel" : "Zobraziť v paneli"}</button></div>`;
}
function render() {
  $("variants").innerHTML = Object.entries(VARIANTS).map(([k, v]) => `<button aria-pressed="${S.variant === k}" data-variant="${k}">${v[0]}</button>`).join("");
  $("note").innerHTML = VARIANTS[S.variant][1];
  const live = AGENTS.filter((a) => a.status === "working");
  const latest = live[S.tick % Math.max(1, live.length)];
  const dock = S.variant === "C" && latest ? `<div class="dock"><span class="dot working"></span><strong>${live.length} agents working</strong><span class="latest">${latest.title} · ${act(latest)}</span><button data-panel>${S.panel ? "Skryť" : "Detail"}</button></div>` : "";
  $("thread").innerHTML = `<div class="user">chcem to tak ako to ma t3 code</div><div class="prose">Kontrakt je hotový a zelený. Spúšťam tri paralelné prúdy implementácie.</div>${body()}<div class="tool">›_ <span>Append Stream 0 results to the shared plan</span><code>cat &gt;&gt; /tmp/t3scout/plan-variant-c.md</code></div><div class="prose">Prúdy majú oddelené súbory, rozhranie medzi vrstvami je vopred dohodnuté.</div><div class="spacer"></div>${dock}<div class="composer">Napíš správu…</div>`;
  const showPanel = S.variant === "C" && S.panel;
  $("panel").hidden = !showPanel;
  $("win").style.setProperty("--panelw", showPanel ? "340px" : "0px");
  $("panel").innerHTML = showPanel ? `<h4><span>Agents</span><span>${summary()}</span></h4>${AGENTS.map(row).join("")}` : "";
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.variant) { S.variant = t.dataset.variant; S.panel = S.variant === "C"; return render(); }
  if ("toggle" in t.dataset) { S.open = !S.open; return render(); }
  if ("panel" in t.dataset) { S.panel = !S.panel; return render(); }
});
document.addEventListener("change", (e) => { if (e.target.id === "theme") $("win").dataset.theme = e.target.value; });
$("theme").innerHTML = Object.entries(THEMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
setInterval(() => { S.tick += 1; AGENTS.forEach((a) => { if (a.status !== "working") return; a.sec += 2; a.tok += 0.7; if (S.tick % 2 === 0) a.tools += 1; }); render(); }, 2000);
render();
</script>
</body>
</html>
