<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codevo · Klonovanie repozitára na server</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #08090b; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#demo { --bg:#0f1115; --panel:#14171c; --surface:#1a1d23; --hover:#22262d; --border:#20232a; --text:#d3d7de; --muted:#9aa0ab; --subtle:#6a7180; --strong:#f1f3f7; --accent:#4fcdb3; --accent-ink:#08201b; --warn:#e4c088; --danger:#ef8a8a; color: var(--text); max-width: 1180px; margin: 0 auto; }
#demo .window[data-theme="light"] { --bg:#f6f7f9; --panel:#eef0f3; --surface:#ffffff; --hover:#e6e9ee; --border:#e5e8ed; --text:#333840; --muted:#656d7b; --subtle:#99a1ad; --strong:#171a1f; --accent:#13836f; --accent-ink:#ffffff; --warn:#9a6a14; --danger:#b3261e; }
#demo .window[data-theme="oneDarkPro"] { --bg:#21252b; --panel:#282c34; --surface:#31363f; --hover:#3a404b; --border:#31363f; --text:#abb2bf; --muted:#9aa2b1; --subtle:#5c6370; --strong:#ffffff; --accent:#61afef; --accent-ink:#21252b; }
#demo .window[data-theme="dracula"] { --bg:#21222c; --panel:#282a36; --surface:#313343; --hover:#3b3e52; --border:#343746; --text:#f8f8f2; --muted:#b3bbe0; --subtle:#6272a4; --strong:#ffffff; --accent:#bd93f9; --accent-ink:#21222c; }
#demo .window[data-theme="catppuccinMocha"] { --bg:#181825; --panel:#1e1e2e; --surface:#2a2a3d; --hover:#35364a; --border:#2a2b3c; --text:#cdd6f4; --muted:#a6adc8; --subtle:#6c7086; --strong:#ffffff; --accent:#cba6f7; --accent-ink:#181825; }
#demo .window[data-theme="ayuMirage"] { --bg:#1f2430; --panel:#232834; --surface:#272d3c; --hover:#323a4c; --border:#2a3140; --text:#cbccc6; --muted:#9aa3b4; --subtle:#707a8c; --strong:#ffffff; --accent:#ffcc66; --accent-ink:#1f2430; }
#demo button, #demo input, #demo select { font: inherit; color: inherit; }
#demo button { cursor: pointer; border: 0; background: none; }
#demo button:disabled { cursor: default; opacity: .45; }
.bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding: 0 2px 14px; color: var(--muted); }
.seg { display:inline-flex; gap:2px; padding:3px; border-radius:9px; background: var(--panel); }
.seg button { padding:5px 11px; border-radius:7px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--strong); }
.bar select { background: var(--panel); border:0; border-radius:8px; padding:6px 10px; }
.note { padding: 0 2px 14px; color: var(--muted); max-width: 86ch; }
.note b { color: var(--strong); font-weight: 600; }
.window { color: var(--text); position:relative; display:grid; grid-template-columns: 236px minmax(0,1fr); min-height: 620px; border-radius: 14px; overflow:hidden; background: var(--bg); }
.side { background: var(--panel); padding: 16px 10px; }
.side h4 { margin: 14px 10px 6px; font-size: 11px; font-weight: 500; letter-spacing:.04em; text-transform: uppercase; color: var(--subtle); }
.env { display:flex; align-items:center; gap:8px; padding: 8px 10px; border-radius: 9px; background: var(--surface); color: var(--strong); }
.dot { width:7px; height:7px; border-radius:50%; background: var(--accent); flex:none; }
.proj { display:block; padding: 7px 10px; border-radius: 8px; color: var(--muted); }
.proj.cur { background: var(--surface); color: var(--strong); }
.proj small { display:block; color: var(--subtle); font-size: 11px; }
.proj .track { height:3px; border-radius:2px; background: var(--hover); margin-top:6px; overflow:hidden; }
.proj .track i { display:block; height:100%; background: var(--accent); transition: width .3s; }
.add { display:flex; align-items:center; gap:8px; width:100%; margin-top:8px; padding:7px 10px; border-radius:8px; color: var(--muted); text-align:left; }
.add:hover { background: var(--hover); color: var(--strong); }
.main { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 32px; }
.empty { max-width: 560px; width:100%; }
.empty h2 { margin:0 0 6px; font-size: 19px; font-weight: 600; color: var(--strong); }
.empty p { margin: 0 0 18px; color: var(--muted); }
.cards { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 14px; }
.card { padding: 14px; border-radius: 12px; background: var(--panel); text-align:left; }
.card:hover, .card[aria-pressed="true"] { background: var(--surface); }
.card[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--accent); }
.card strong { display:block; color: var(--strong); font-weight: 600; margin: 8px 0 2px; }
.card span { color: var(--muted); font-size: 12px; }
.backdrop { position:absolute; inset:0; background: color-mix(in srgb, var(--bg) 62%, transparent); display:flex; justify-content:center; align-items:flex-start; padding-top: 64px; }
.dialog { width: min(620px, calc(100% - 40px)); border-radius: 14px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.45); overflow:hidden; }
.inline { border-radius: 12px; background: var(--panel); overflow:hidden; }
.crumb { display:flex; align-items:center; gap:8px; padding: 10px 14px 0; color: var(--muted); font-size: 12px; }
.crumb button { color: var(--muted); padding:2px 6px; border-radius:6px; }
.crumb button:hover { background: var(--hover); color: var(--strong); }
.tabs { display:flex; gap:2px; padding: 10px 10px 0; }
.tabs button { display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius: 8px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--strong); }
.search { display:flex; align-items:center; gap:10px; margin: 10px; padding: 0 12px; border-radius: 10px; background: var(--surface); }
.search input { flex:1; min-width:0; padding: 11px 0; border:0; outline:0; background:transparent; }
.search select { border:0; outline:0; background: var(--hover); border-radius: 7px; padding: 4px 8px; font-size:12px; }
.search:focus-within { box-shadow: 0 0 0 1.5px var(--accent); }
.label { padding: 4px 16px; font-size: 11px; letter-spacing:.04em; text-transform:uppercase; color: var(--subtle); }
.list { max-height: 292px; overflow:auto; padding: 0 6px 6px; }
.row { display:grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items:center; width:100%; padding: 8px 10px; border-radius: 9px; text-align:left; }
.row:hover, .row.active { background: var(--surface); }
.row strong { color: var(--strong); font-weight: 500; }
.row strong em { font-style: normal; color: var(--subtle); }
.row small { display:block; color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta { display:flex; align-items:center; gap:8px; color: var(--subtle); font-size: 11px; }
.badge { padding: 1px 7px; border-radius: 999px; background: var(--hover); color: var(--muted); font-size: 11px; }
.badge.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.state { padding: 18px 16px; color: var(--muted); }
.state b { color: var(--warn); font-weight: 500; }
.form { padding: 6px 16px 14px; display:grid; gap: 12px; }
.repo { display:flex; align-items:center; gap:10px; padding: 12px; border-radius: 10px; background: var(--surface); }
.repo strong { color: var(--strong); }
.field { display:grid; gap:5px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select { padding: 9px 11px; border:0; outline:0; border-radius: 8px; background: var(--surface); }
.field input:focus, .field select:focus { box-shadow: 0 0 0 1.5px var(--accent); }
.two { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { color: var(--subtle); font-size: 12px; }
.foot { display:flex; align-items:center; gap: 12px; padding: 10px 14px; color: var(--subtle); font-size: 11px; border-top: 1px solid var(--border); }
.foot kbd { font: inherit; padding: 1px 5px; border-radius: 4px; background: var(--surface); color: var(--muted); margin-right: 3px; }
.foot .sp { flex:1; }
.primary { padding: 7px 14px; border-radius: 8px; background: var(--accent) !important; color: var(--accent-ink) !important; font-weight: 600; font-size: 12px; }
.ghost { padding: 7px 12px; border-radius: 8px; color: var(--muted); font-size: 12px; }
.ghost:hover { background: var(--hover); color: var(--strong); }
.composer { width:100%; max-width:560px; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--panel); color: var(--subtle); }
.composer.ready { color: var(--muted); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 50%, transparent); }
svg { flex:none; }
@media (max-width: 820px) { .window { grid-template-columns: 1fr; } .side { display:none; } .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="demo" data-theme="dark">
  <div class="bar">
    <div class="seg" id="variants"></div>
    <label>Téma <select id="theme"></select></label>
  </div>
  <p class="note" id="note"></p>
  <div class="window">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script>
const ICON = {
  github: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>',
  gitlab: '<svg width="16" height="16" viewBox="0 0 16 16"><path fill="#e24329" d="M8 14.5 10.9 5.6H5.1z"/><path fill="#fc6d26" d="M8 14.5 5.1 5.6h-4zM8 14.5l2.9-8.9h4z"/><path fill="#fca326" d="M1.1 5.6.2 8.3c-.1.3 0 .5.2.7L8 14.5zM14.9 5.6l.9 2.7c.1.3 0 .5-.2.7L8 14.5z"/><path fill="#e24329" d="M1.1 5.6h4L3.4.4c-.1-.3-.5-.3-.6 0zM14.9 5.6h-4L12.6.4c.1-.3.5-.3.6 0z"/></svg>',
  url: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  lock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const THEMES = { dark: "Codevo Dark", light: "Codevo Light", oneDarkPro: "One Dark Pro", dracula: "Dracula", catppuccinMocha: "Catppuccin Mocha", ayuMirage: "Ayu Mirage" };
const VARIANTS = {
  A: ["A · Dialóg so záložkami", "<b>Rozšírenie dnešného dialógu Add project.</b> Záložky Priečinok, GitHub, GitLab a Git URL nad rovnakým vyhľadávacím poľom. Najmenší zásah, rovnaká klávesnica ako Quick Open."],
  B: ["B · Priamo v prázdnom threade", "<b>Nahrádza dnešný select Choose a project on this server.</b> Tri karty a vyhľadávanie priamo na mieste, bez modálneho okna. Používateľ vidí klon ako rovnocennú voľbu hneď pred prvým promptom."],
  C: ["C · Kroky ako v T3 Code", "<b>Verná kópia toku T3.</b> Zdroj, potom repozitár, potom potvrdenie. Rozdiel oproti T3: tam sa píše presné owner/repo, u nás je živé vyhľadávanie."]
};
const HOSTS = { github: ["github.com"], gitlab: ["git.efabrica.sk", "gitlab.com"] };
const REPOS = {
  "github.com": [
    ["mockor/codevo-editor", "Native desktop IDE", "private", "pred 2 h", false],
    ["mockor/codevo-runner", "Remote runner daemon", "private", "včera", true],
    ["mockor/dotfiles", "zsh, git, nvim", "public", "pred 3 d", false],
    ["acme-team/storefront-api", "Express + Postgres API", "private", "pred 5 h", false],
    ["acme-team/storefront-web", "Next.js storefront", "private", "pred 1 d", false],
    ["acme-team/design-tokens", "Shared tokens", "internal", "pred 2 t", false],
    ["pingdotgg/t3code", "T3 Code", "public", "pred 1 h", false]
  ],
  "git.efabrica.sk": [
    ["platform/billing-service", "Fakturácia a platby", "private", "pred 1 h", false],
    ["platform/billing-admin", "Admin rozhranie", "private", "pred 4 h", true],
    ["platform/notification-hub", "E-mail, SMS, push", "internal", "včera", false],
    ["web/customer-portal", "Zákaznícky portál", "private", "pred 2 d", false],
    ["infra/deploy-scripts", "CI a deploy", "internal", "pred 1 t", false]
  ],
  "gitlab.com": [
    ["mockor/playground", "Experimenty", "private", "pred 3 t", false],
    ["gitlab-org/gitlab-runner", "GitLab Runner", "public", "pred 6 h", false]
  ]
};
const S = { variant: "A", source: "github", host: "github.com", query: "", active: 0, step: "pick", sel: null, open: true, picked: null, job: null, srcStep: true };
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function results() {
  const q = S.query.trim().toLowerCase();
  return (REPOS[S.host] || []).filter((r) => q === "" || r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q));
}
function hl(name) {
  const q = S.query.trim(); if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + "<em style='color:var(--accent)'>" + esc(name.slice(i, i + q.length)) + "</em>" + esc(name.slice(i + q.length));
}
function tabs() {
  const t = [["folder", "Priečinok na serveri"], ["github", "GitHub"], ["gitlab", "GitLab"], ["url", "Git URL"]];
  if (S.variant === "B") t.shift();
  return '<div class="tabs" role="tablist">' + t.map(([k, l]) => `<button role="tab" aria-selected="${S.source === k}" data-source="${k}">${ICON[k]}${l}</button>`).join("") + "</div>";
}
function picker() {
  if (S.source === "folder") return `<div class="search">${ICON.search}<input placeholder="Filter directories" disabled></div><div class="label">~/Developer</div><div class="list">${["billing-admin", "codevo-runner", "scratch"].map((n) => `<div class="row">${ICON.folder}<span><strong>${n}</strong></span><span></span></div>`).join("")}</div><div class="state">Dnešný prehliadač priečinkov, bez zmeny.</div>`;
  if (S.source === "url") return `<div class="form" style="padding-top:12px"><label class="field"><span>Repository URL</span><input id="url" placeholder="git@github.com:owner/project.git" value=""></label><div class="hint">Pre hostingy mimo GitHub a GitLab. Prihlasovacie údaje v URL sa neukladajú ani nezobrazujú.</div></div>`;
  const hosts = HOSTS[S.source], list = results();
  const hostSel = hosts.length > 1 ? `<select id="host" aria-label="GitLab inštancia">${hosts.map((h) => `<option ${h === S.host ? "selected" : ""}>${h}</option>`).join("")}</select>` : `<span class="badge">${S.host}</span>`;
  const rows = list.map((r, i) => `<button class="row ${i === S.active ? "active" : ""}" data-repo="${i}">${ICON[S.source]}<span><strong>${hl(r[0])}</strong><small>${esc(r[1])}</small></span><span class="meta">${r[4] ? '<span class="badge on">už na serveri</span>' : ""}${r[2] !== "public" ? ICON.lock : ""}<span>${r[2]}</span><span>${r[3]}</span></span></button>`).join("");
  const empty = S.query.includes("zzz") ? `<div class="state"><b>${S.source === "github" ? "gh" : "glab"} nie je prihlásený.</b> Spusti prihlásenie v termináli alebo použi Git URL.</div>` : `<div class="state">Nič sa nenašlo. Skús celé <b>owner/repo</b> alebo záložku Git URL.</div>`;
  return `<div class="search">${ICON.search}<input id="q" placeholder="Hľadať v ${S.source === "github" ? "GitHub" : "GitLab"} repozitároch" value="${esc(S.query)}" autocomplete="off">${hostSel}</div><div class="label">${S.query ? "Výsledky" : "Nedávno aktualizované, kde si členom"}</div><div class="list">${list.length ? rows : empty}</div>`;
}
function confirm() {
  const name = S.sel ? S.sel[0].split("/").pop() : "project";
  return `<div class="crumb"><button data-back>← Späť</button><span>Potvrdiť klon</span></div><div class="form" style="padding-top:12px"><div class="repo">${ICON[S.source]}<span><strong>${esc(S.sel ? S.sel[0] : "Git URL")}</strong><div class="hint">${esc(S.host)} · ${S.sel ? S.sel[2] : "vlastná URL"}</div></span></div><label class="field"><span>Cieľ na serveri</span><input value="~/Developer/${esc(name)}"></label><div class="two"><label class="field"><span>Vetva</span><select><option>Predvolená (main)</option><option>develop</option></select></label><label class="field"><span>Protokol</span><select><option>SSH</option><option>HTTPS</option></select></label></div><div class="hint">Klon beží na serveri s Git prístupom nastaveným na serveri. Editor môžeš medzitým zavrieť.</div>${S.sel && S.sel[4] ? '<div class="hint" style="color:var(--warn)">Tento repozitár už na serveri je. Môžeš ho otvoriť namiesto nového klonu.</div>' : ""}</div>`;
}
function footer() {
  const pick = S.step === "pick";
  const action = pick ? (S.source === "folder" ? "Add project" : "Pokračovať") : (S.sel && S.sel[4] ? "Otvoriť existujúci" : "Klonovať na server");
  return `<div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd>výber</span><span><kbd>↵</kbd>${pick ? "vybrať" : "klonovať"}</span><span><kbd>esc</kbd>zavrieť</span><span class="sp"></span><button class="ghost" data-close>Zrušiť</button><button class="primary" data-go>${action}</button></div>`;
}
function sources() {
  const s = [["folder", "Priečinok na serveri", "Otvoriť existujúci priečinok"], ["url", "Git URL", "Klonovať zo vzdialenej URL"], ["github", "GitHub repozitár", "Vyhľadať a klonovať"], ["gitlab", "GitLab repozitár", "git.efabrica.sk, gitlab.com"]];
  return `<div class="crumb"><span>Pridať projekt · Linux server</span></div><div class="label" style="padding-top:12px">Zdroje</div><div class="list">${s.map(([k, t, d]) => `<button class="row" data-source="${k}">${ICON[k]}<span><strong>${t}</strong><small>${d}</small></span><span class="meta">→</span></button>`).join("")}</div>`;
}
function flow() {
  if (S.variant === "C" && S.srcStep) return sources() + `<div class="foot"><span><kbd>esc</kbd>zavrieť</span></div>`;
  const head = S.step === "confirm" ? confirm() : (S.variant === "C" ? `<div class="crumb"><button data-src>← Zdroje</button><span>${S.source}</span></div>` : tabs()) + picker();
  return head + footer();
}
function side() {
  const job = S.job ? `<span class="proj ${S.job.p >= 100 ? "cur" : ""}">${esc(S.job.name)}<small>${S.job.p >= 100 ? "pripravený" : `klonujem · ${S.job.phase} ${S.job.p}%`}</small>${S.job.p < 100 ? `<span class="track"><i style="width:${S.job.p}%"></i></span>` : ""}</span>` : "";
  $("side").innerHTML = `<div class="env"><span class="dot"></span>Linux server · dev-01</div><h4>Projekty na serveri</h4><span class="proj">billing-admin<small>~/Developer/billing-admin</small></span><span class="proj">codevo-runner<small>~/Developer/codevo-runner</small></span>${job}<button class="add" data-open>${ICON.plus}Pridať projekt</button>`;
}
function main() {
  const ready = S.job && S.job.p >= 100;
  const composer = `<div class="composer ${ready ? "ready" : ""}">${ready ? `Projekt ${esc(S.job.name)} je pripravený. Napíš prvú správu…` : S.job ? "Klon beží na pozadí. Thread sa odomkne po dokončení." : "Najprv vyber projekt, v ktorom má thread bežať."}</div>`;
  if (S.variant === "B") {
    const cards = [["existing", "folder", "Existujúci projekt", "2 projekty na serveri"], ["clone", "github", "Naklonovať repozitár", "GitHub, GitLab alebo URL"], ["dir", "folder", "Otvoriť priečinok", "Prehliadať disk servera"]];
    const body = S.picked === "clone" && !ready ? `<div class="inline">${flow()}</div>` : "";
    $("main").innerHTML = `<div class="empty"><h2>Kde má tento thread bežať?</h2><p>Vyber projekt na serveri alebo si sem naklonuj nový repozitár.</p><div class="cards">${cards.map(([k, i, t, d]) => `<button class="card" aria-pressed="${S.picked === k}" data-card="${k}">${ICON[i]}<strong>${t}</strong><span>${d}</span></button>`).join("")}</div>${body}</div>${composer}`;
    return;
  }
  $("main").innerHTML = `<div class="empty"><h2>Choose a project on this server</h2><p>Choose where this thread should run. Then add your images and send your message.</p><button class="ghost" data-open style="background:var(--panel)">${ICON.plus} Pridať projekt alebo naklonovať repozitár</button></div>${composer}${S.open ? `<div class="backdrop"><section class="dialog" aria-label="Add project">${flow()}</section></div>` : ""}`;
}
function render(focus) {
  $("variants").innerHTML = Object.entries(VARIANTS).map(([k, v]) => `<button aria-pressed="${S.variant === k}" data-variant="${k}">${v[0]}</button>`).join("");
  $("note").innerHTML = VARIANTS[S.variant][1];
  side(); main();
  if (focus) { const q = $("q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
function go() {
  if (S.step === "pick") {
    if (S.source === "folder") { S.open = false; S.picked = null; return render(); }
    if (S.source === "url") { S.sel = null; S.step = "confirm"; return render(); }
    const r = results()[S.active]; if (!r) return;
    S.sel = r; S.step = "confirm"; return render();
  }
  const name = S.sel ? S.sel[0].split("/").pop() : "project";
  S.open = false; S.step = "pick"; S.job = { name, p: 0, phase: "prijímam objekty" }; render();
  const job = S.job;
  const timer = setInterval(() => {
    if (S.job !== job) return clearInterval(timer);
    S.job.p = Math.min(100, S.job.p + 7); if (S.job.p > 70) S.job.phase = "checkout";
    if (S.job.p >= 100) clearInterval(timer);
    render();
  }, 260);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.variant) { Object.assign(S, { variant: d.variant, step: "pick", open: true, picked: d.variant === "B" ? "clone" : null, srcStep: true, job: null, query: "", active: 0 }); return render(true); }
  if (d.source) { S.source = d.source; S.host = (HOSTS[d.source] || [""])[0]; S.query = ""; S.active = 0; S.srcStep = false; return render(true); }
  if (d.repo !== undefined) { S.active = Number(d.repo); return go(); }
  if (d.card) { S.picked = d.card; S.step = "pick"; S.job = null; return render(true); }
  if ("back" in d) { S.step = "pick"; return render(true); }
  if ("src" in d) { S.srcStep = true; return render(); }
  if ("open" in d) { S.open = true; S.srcStep = true; S.step = "pick"; if (S.variant === "B") S.picked = "clone"; return render(true); }
  if ("close" in d) { S.open = false; S.picked = null; return render(); }
  if ("go" in d) return go();
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.query = e.target.value; S.active = 0; render(true); } });
document.addEventListener("change", (e) => {
  if (e.target.id === "host") { S.host = e.target.value; S.active = 0; render(true); }
  if (e.target.id === "theme") document.querySelector(".window").dataset.theme = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (e.target.id !== "q") return; const n = results().length;
  if (e.key === "ArrowDown" && n) { e.preventDefault(); S.active = (S.active + 1) % n; render(true); }
  if (e.key === "ArrowUp" && n) { e.preventDefault(); S.active = (S.active - 1 + n) % n; render(true); }
  if (e.key === "Enter") { e.preventDefault(); go(); }
  if (e.key === "Escape") { S.open = false; S.picked = null; render(); }
});
$("theme").innerHTML = Object.entries(THEMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
render(true);
</script>
</body>
</html>
