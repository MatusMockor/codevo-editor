[package]
name = "codevo-editor"
version = "0.2.0-beta.4"
description = "Codevo Editor is a Fleet-like PHP-focused desktop code editor"
authors = ["Matus Mockor"]
edition = "2021"
default-run = "codevo-editor"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codevo-editor"
path = "src/main.rs"

[[example]]
name = "codevo-perf-capture-launcher"
path = "src/perf_capture_launcher_tool/main.rs"
required-features = ["perf-capture-launcher"]

[features]
default = []
perf-capture = ["dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
perf-capture-launcher = ["perf-capture"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
ignore = "0.4.26"
json5 = "0.4"
regex = "1"
libc = "0.2"
notify = "8.2.0"
tree-sitter = "0.26.9"
tree-sitter-php = "0.24.2"
portable-pty = "0.9.0"
fontdb = "0.23.0"
quick-xml = "=0.39.4"
tungstenite = "0.30.0"
base64 = "0.22"
minisign-verify = "0.2.5"
sourcemap = "9"
unicode-ident = "1"
unicode-id-start = "1.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", optional = true }
objc2 = { version = "=0.6.4", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["libc", "NSApplication", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["NSDate", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSURL", "block2"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[dev-dependencies]
anyhow = "1"
tauri = { version = "2", features = ["test"] }

[profile.dev.package.sha2]
opt-level = 3
