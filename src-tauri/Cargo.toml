[package]
name = "codevo-editor"
version = "0.2.0-beta.128"
description = "Codevo is a desktop app for running and reviewing AI coding agents"
authors = ["Matus Mockor"]
edition = "2021"
default-run = "codevo-editor"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codevo-editor"
path = "src/main.rs"

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "=2.4.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
bytes = "1"
http-body = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "time"] }
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
ignore = "0.4.26"
regex = "1"
libc = "0.2"
notify = "8.2.0"
portable-pty = "0.9.0"
fontdb = "0.23.0"
tungstenite = "0.30.0"
base64 = "0.22"
minisign-verify = "0.2.5"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4" }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSDate", "NSDictionary", "NSNotification", "NSObject", "NSOperation", "NSRunLoop", "NSString", "NSURL", "NSUserDefaults", "NSValue", "block2"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[dev-dependencies]
anyhow = "1"
tauri = { version = "2", features = ["test"] }

[profile.dev.package.sha2]
opt-level = 3
